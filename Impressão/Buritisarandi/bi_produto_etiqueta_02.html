<style>
    /* ============================================================
       TAMANHO EXATO DA ETIQUETA
       ============================================================ */

    @page {
        size: 6cm 4cm;
        margin: 0 !important;
    }

    html,
    body {
        width: 6cm;
        margin: 0 !important;
        padding: 0 !important;

        font-family: Arial, Helvetica, sans-serif;
        color: #000000;
        background: #ffffff;

        font-size: 11px;
    }

    /*
     * NÃO colocar height: 4cm aqui.
     * NÃO colocar height: 4cm no body.
     * Isso evita o DOMPDF criar uma página extra.
     */

    .etiqueta {
        width: 6cm;

        margin: 0 !important;
        padding: 0.60cm 0.45cm 0 0.40cm;

        box-sizing: border-box;

        text-align: left;

        overflow: hidden;

        page-break-before: auto !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
    }


    /* ============================================================
       CÓDIGO DE BARRAS
       ============================================================ */

    .barcode-img {
    display: block;

    height: 20px;
    width: 3.8cm;

    margin: 0 0 4px 0;
    padding: 0;

    object-fit: fill;
    }


    /* ============================================================
       NÚMERO DO CÓDIGO DE BARRAS
       ============================================================ */

    .codigo-barra {
        width: 5cm;

        margin: 0 0 5px 0;
        padding: 0;

        font-size: 10px;
        line-height: 1;

        letter-spacing: 0.3px;

        text-align: left;

        white-space: nowrap;
    }


    /* ============================================================
       DESCRIÇÃO
       ============================================================ */

    .descricao {
        /*
         * Não deixa o nome chegar até a borda direita.
         */
        width: 4.80cm;
        max-width: 4.80cm;

        margin: 0 0 4px 0;
        padding: 0;

        font-size: 11px;
        line-height: 1.20;

        text-align: left;

        word-wrap: break-word;
        overflow-wrap: break-word;

        overflow: hidden;
    }


    /* ============================================================
       CÓDIGO DO PRODUTO
       ============================================================ */

    .codigo-produto {
        width: 4.80cm;

        margin: 0;
        padding: 0;

        font-size: 11px;
        line-height: 1.20;

        text-align: left;

        white-space: nowrap;
    }
</style>


<div class="etiqueta">

    <!-- CÓDIGO DE BARRAS -->
    <img
        class="barcode-img"
        src="{$imagem_cod_outro}"
        onerror="this.style.display='none';"
        alt=""
    >

    <!-- NÚMERO DO CÓDIGO DE BARRAS -->
    <div class="codigo-barra">
        {$cod_barra}
    </div>

    <!-- DESCRIÇÃO DO PRODUTO -->
    <div class="descricao">
        {$descricao}
    </div>

    <!-- CÓDIGO DO PRODUTO -->
    <div class="codigo-produto">
        Cod Prod: {$id}
    </div>

</div>
