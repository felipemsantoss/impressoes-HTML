<!--[main]-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta de Despacho</title>
    <style>
        /* CONFIGURAÇÃO EXATA E INVOCÁVEL DA FONTE GLOBAL NO DOMPDF */
        * {
            font-family: Arial, Helvetica, sans-serif !important;
            box-sizing: border-box !important;
        }

        /* CONFIGURAÇÃO DAS DIMENSÕES EXATAS DA PÁGINA (13,00cm x 8,00cm) E MARGENS */
        @page {
            size: 13.00cm 8.00cm;
            margin: 0.10cm 0.10cm 0.00cm 0.10cm; /* Cima: 0,10cm | Direita: 0,10cm | Baixo: 0 | Esquerda: 0,10cm */
        }

        /* COMPENSAÇÃO DE SEGURANÇA INTERNA DO CORPO DO TEXTO */
        body {
            margin: 0;
            padding: 8px 15px; /* Margem interna de segurança para evitar corte na impressão física */
            color: #000000;
            line-height: 1.4;
            font-size: 12px; /* Padronizado para 12px */
            background-color: #ffffff;
        }

        .bold {
            font-weight: bold;
        }

        .text-center {
            text-align: center;
        }

        /* Estrutura de colunas sem bordas para alinhar NF e Volume lado a lado */
        table {
            width: 100%;
            border-collapse: collapse !important;
            table-layout: fixed;
            margin-top: 4px;
            margin-bottom: 2px;
        }

        td {
            padding: 1px 0;
            vertical-align: top;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <!-- Emitente -->
    <div class="bold" style="font-size: 13px; margin-bottom: 8px;">
        {$pessoa_unidade_descricao}
    </div>

    <!-- Destinatário -->
    <div class="bold" style="margin-bottom: 2px;">
        Destinatário
    </div>
    <div>
        {$pessoa_descricao}
    </div>
    <div>
        {$local_municipio_descricao} / {$local_uf_descricao}
    </div>
    <div>
        <span class="bold">CEP</span> {$cep}
    </div>

    <!-- Dados de Controle (NF e Volume alinhados perfeitamente ao meio) -->
    <table>
        <colgroup>
            <col style="width: 50%;">
            <col style="width: 50%;">
        </colgroup>
        <tr>
            <td class="bold">
                NF: <span style="font-weight: normal;">{$codigo}</span>
            </td>
            <td class="bold">
                Volume: <span style="font-weight: normal;">{$volume_qtde}</span>
            </td>
        </tr>
    </table>

    <!-- Transportadora -->
    <div style="margin-top: 4px;">
        <span class="bold">Transportadora:</span> {$pessoa_transportadora_descricao}
    </div>

</body>
</html>
<!--[/main]-->
