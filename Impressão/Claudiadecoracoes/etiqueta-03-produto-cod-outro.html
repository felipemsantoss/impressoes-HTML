<!--[main]-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Etiquetas de Código de Barras</title>
    <style>
        /* CONFIGURAÇÃO GLOBAL DE SINTAXE E ENCODING */
        * {
            font-family: Arial, Helvetica, sans-serif !important;
            box-sizing: border-box !important;
            font-weight: normal !important; /* ABSOLUTAMENTE NADA EM NEGRITO */
        }

        /* DIMENSÕES FÍSICAS EXATAS DA PÁGINA DE ETIQUETA (11.00cm x 2.00cm) */
        @page {
            size: 11.00cm 2.00cm;
            margin: 0px !important;
        }

        /* RESET E TAMANHO FIXO DA BOBINA */
        html, body {
            width: 11.00cm;
            height: 2.00cm;
            margin: 0 !important;
            padding: 0 !important;
            font-size: 9px;
            color: #000000;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* ESTRUTURA DE 3 COLUNAS SEM LINHAS DE GRADE */
        table {
            width: 11.00cm;
            height: 2.00cm;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            table-layout: fixed !important;
        }

        /* CADA CÉLULA OCUPA EXATAMENTE 1/3 DA BOBINA COM FOLGA SIMÉTRICA
           NAS LATERAIS, PARA QUE PEQUENOS DESVIOS DE ALINHAMENTO DA BOBINA
           NÃO CORTEM O TEXTO DA 2ª E DA 3ª ETIQUETA */
        td {
            width: 3.6666cm;
            padding: 1.5px 4px 0px 4px;
            vertical-align: top;
            border: none !important;
            overflow: hidden;
            word-wrap: break-word;
            line-height: 1.0;
        }

        /* BLOCO INTERNO CENTRALIZADO: A SOBRA HORIZONTAL FICA DIVIDIDA
           IGUALMENTE DOS DOIS LADOS */
        .etq {
            width: 100%;
            text-align: center;
        }

        .etq .linha {
            font-size: 9px;
            margin: 0;
            padding: 0;
            line-height: 1.05;
        }

        /* CÓDIGO DE BARRAS */
        .barcode-img {
            display: inline-block;
            height: 12px;
            width: auto;
            max-width: 100%;
        }

        .cod-legivel {
            font-size: 9px;
            text-align: center;
            width: 100%;
            margin-top: 1px;
            letter-spacing: 0.3px;
        }

        /* TRUQUE DE SEGURANÇA: OCULTA O ELEMENTO SE A IMAGEM ESTIVER EM BRANCO OU NÃO FOR ENCONTRADA */
        img[src=""], img:not([src]) {
            display: none !important;
        }

        /* TRUQUE DE MÁGICA CSS: SE A VARIÁVEL DE VALOR VIER VAZIA DO BANCO, FORÇA EXIBIÇÃO DE "0,00" */
        .price-value:empty::before {
            content: "0,00";
        }
    </style>
</head>
<body>

    <!-- Grade Horizontal de 3 Colunas de Etiquetas de Gôndola -->
    <table>
        <colgroup>
            <col style="width: 3.6666cm;">
            <col style="width: 3.6666cm;">
            <col style="width: 3.6666cm;">
        </colgroup>
        <tr>
            <!-- Coluna 1 -->
            <td>
                <div class="etq">
                    <div class="linha">{$descricao}</div>
                    <div class="linha">R$ <span class="price-value">{$preco_venda}</span></div>
                </div>
                <div style="text-align: center; width: 100%; margin-top: 1px;">
                    <img class="barcode-img" src="{$imagem_cod_outro}" onerror="this.style.display='none';" alt="Código de Barras">
                </div>
                <div class="cod-legivel">{$cod_outro}</div>
            </td>
            <!-- Coluna 2 -->
            <td>
                <div class="etq">
                    <div class="linha">{$descricao}</div>
                    <div class="linha">R$ <span class="price-value">{$preco_venda}</span></div>
                </div>
                <div style="text-align: center; width: 100%; margin-top: 1px;">
                    <img class="barcode-img" src="{$imagem_cod_outro}" onerror="this.style.display='none';" alt="Código de Barras">
                </div>
                <div class="cod-legivel">{$cod_outro}</div>
            </td>
            <!-- Coluna 3 -->
            <td>
                <div class="etq">
                    <div class="linha">{$descricao}</div>
                    <div class="linha">R$ <span class="price-value">{$preco_venda}</span></div>
                </div>
                <div style="text-align: center; width: 100%; margin-top: 1px;">
                    <img class="barcode-img" src="{$imagem_cod_outro}" onerror="this.style.display='none';" alt="Código de Barras">
                </div>
                <div class="cod-legivel">{$cod_outro}</div>
            </td>
        </tr>
    </table>

</body>
</html>
<!--[/main]-->
