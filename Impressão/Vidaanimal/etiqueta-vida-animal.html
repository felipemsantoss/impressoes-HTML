<!--[main]-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta de Produto</title>
    <style>
        /* FONTE GLOBAL NO DOMPDF */
        * {
            font-family: Arial, Helvetica, sans-serif !important;
            font-weight: normal !important;
        }

        /* BOBINA COM 2 ETIQUETAS LADO A LADO (8.00cm x 2.00cm = 2 x 4.00cm x 2.00cm) */
        @page {
            size: 8.00cm 2.00cm;
            margin: 0 !important;
        }

        /* NÃO colocar height no html/body: evita o DOMPDF criar uma página extra */
        html, body {
            width: 8.00cm;
            margin: 0 !important;
            padding: 0 !important;
            color: #000000;
            background-color: #ffffff;
        }

        /* POSIÇÃO DE CADA ETIQUETA NA BOBINA (MEDIDA NA IMPRESSÃO REAL):
           A 2ª ETIQUETA COMEÇA ~4.40cm DEPOIS DA 1ª (ETIQUETA + ESPAÇO ENTRE ELAS).
           CAIXA DE ALTURA FIXA: TEXTO GRANDE DEMAIS É CORTADO EM VEZ DE GERAR PÁGINA NOVA */
        .etq {
            position: absolute;
            top: 0.08cm;
            width: 3.25cm;
            height: 1.85cm;
            overflow: hidden;
        }
        .etq-1 { left: 0.34cm; }
        .etq-2 { left: 4.73cm; }

        /* NOME DA UNIDADE (TEXTO FIXO: A VIEW DE PRODUTO NAO TRAZ DADOS DA UNIDADE) */
        .unidade {
            font-size: 7.5pt;
            line-height: 1.0;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
        }

        /* LINHA DO CÓDIGO DE BARRAS + DATA (IMAGEM E DATA NA MESMA LINHA, DATA ALINHADA NA BASE) */
        .linha-barra {
            width: 3.25cm;
            margin-top: 1px;
            white-space: nowrap;
            line-height: 1.0;
        }

        .barcode-img {
            display: inline-block;
            vertical-align: bottom;
            width: 2.05cm;
            height: 0.48cm;
        }

        /* OCULTA A IMAGEM SE VIER EM BRANCO */
        img[src=""], img:not([src]) {
            display: none !important;
        }

        /* DATA: LARGURA FIXA MOSTRA SÓ O DD/MM/AAAA (CORTA A HORA DA VARIAVEL data_hoje) */
        .data {
            display: inline-block;
            vertical-align: bottom;
            margin-left: 0.08cm;
            width: 1.08cm;
            font-size: 5.8pt;
            line-height: 1.0;
            white-space: nowrap;
            overflow: hidden;
        }

        /* NÚMERO DO CÓDIGO DE BARRAS */
        .codigo-barra {
            font-size: 6pt;
            line-height: 1.0;
            margin-top: 3pt;
            letter-spacing: 0.1px;
            white-space: nowrap;
        }

        /* DESCRIÇÃO DO PRODUTO (ATÉ 2 LINHAS)
           POSIÇÃO ABSOLUTA: DESCRIÇÃO LONGA É CORTADA SEM EMPURRAR A ETIQUETA PARA OUTRA PÁGINA */
        .descricao {
            position: absolute;
            top: 1.08cm;
            left: 0;
            width: 3.25cm;
            font-size: 6.6pt;
            line-height: 0.9;
            text-transform: uppercase;
            word-wrap: break-word;
            height: 0.40cm;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- ETIQUETA 1 (ESQUERDA) -->
    <div class="etq etq-1">
        <div class="unidade">VIDA ANIMAL NILDO</div>
        <div class="linha-barra"><img class="barcode-img" src="{$imagem_codigo_barras}" onerror="this.style.display='none';" alt=""><span class="data">{$data_hoje}</span></div>
        <div class="codigo-barra">{$cod_barra}</div>
        <div class="descricao">{$descricao}</div>
    </div>

    <!-- ETIQUETA 2 (DIREITA) -->
    <div class="etq etq-2">
        <div class="unidade">VIDA ANIMAL NILDO</div>
        <div class="linha-barra"><img class="barcode-img" src="{$imagem_codigo_barras}" onerror="this.style.display='none';" alt=""><span class="data">{$data_hoje}</span></div>
        <div class="codigo-barra">{$cod_barra}</div>
        <div class="descricao">{$descricao}</div>
    </div>

</body>
</html>
<!--[/main]-->
