<!--[main]-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta de Produto</title>
    <style>
        /* FONTE GLOBAL NO DOMPDF */
        * {
            font-family: Arial, Helvetica, sans-serif !important;
            font-weight: normal !important;
        }

        /* BOBINA COM 2 ETIQUETAS LADO A LADO (8.00cm x 2.00cm = 2 x 4.00cm x 2.00cm) */
        @page {
            size: 8.00cm 2.00cm;
            margin: 0 !important;
        }

        /* NÃO colocar height no html/body: evita o DOMPDF criar uma página extra */
        html, body {
            width: 8.00cm;
            margin: 0 !important;
            padding: 0 !important;
            color: #000000;
            background-color: #ffffff;
        }

        /* POSIÇÃO DE CADA ETIQUETA NA BOBINA (MEDIDA NA IMPRESSÃO REAL):
           A 2ª ETIQUETA COMEÇA ~4.40cm DEPOIS DA 1ª (ETIQUETA + ESPAÇO ENTRE ELAS).
           CAIXA DE ALTURA FIXA: TEXTO GRANDE DEMAIS É CORTADO EM VEZ DE GERAR PÁGINA NOVA */
        .etq {
            position: absolute;
            top: 0.08cm;
            width: 2.80cm;
            height: 1.90cm;
            overflow: hidden;
        }
        .etq-1 { left: 0.83cm; }
        .etq-2 { left: 5.22cm; } /* LIMITE: O PREÇO DA 2ª ETIQUETA TERMINA NO FIM DA PÁGINA (8cm) */

        /* DESCRIÇÃO DO PRODUTO (1 LINHA, O QUE PASSAR DA LARGURA É CORTADO) */
        .descricao {
            font-size: 5.6pt;
            line-height: 1.0;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
        }

        /* LINHA DO CÓDIGO OUTRO (ESQUERDA) + PREÇO (DIREITA) */
        .linha-cod {
            position: relative;
            height: 0.36cm;
            margin-top: 1.5pt;
            white-space: nowrap;
        }
        .cod-outro {
            position: absolute;
            bottom: 0;
            left: 0;
            font-size: 7pt;
            line-height: 1.0;
        }
        /* PREÇO MAIOR, ALINHADO NA BASE DA LINHA DO CÓDIGO */
        .preco {
            position: absolute;
            bottom: 0;
            right: 0.05cm;
            font-size: 9.5pt;
            line-height: 1.0;
        }

        /* SE O PREÇO VIER VAZIO DO BANCO, MOSTRA "0,00" */
        .price-value:empty::before {
            content: "0,00";
        }

        /* CÓDIGO DE BARRAS */
        .barcode-img {
            display: block;
            width: 2.40cm;
            height: 0.58cm;
            margin-top: 1.5pt;
        }

        /* OCULTA A IMAGEM SE VIER EM BRANCO */
        img[src=""], img:not([src]) {
            display: none !important;
        }

        /* NÚMERO DO CÓDIGO DE BARRAS */
        .codigo-barra {
            font-size: 7pt;
            line-height: 1.0;
            margin-top: 1.5pt;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- ETIQUETA 1 (ESQUERDA) -->
    <div class="etq etq-1">
        <div class="descricao">{$descricao}</div>
        <div class="linha-cod"><span class="cod-outro">{$cod_outro}</span><span class="preco">R$ <span class="price-value">{$preco_venda}</span></span></div>
        <img class="barcode-img" src="{$imagem_codigo_barras}" onerror="this.style.display='none';" alt="">
        <div class="codigo-barra">{$cod_barra}</div>
    </div>

    <!-- ETIQUETA 2 (DIREITA) -->
    <div class="etq etq-2">
        <div class="descricao">{$descricao}</div>
        <div class="linha-cod"><span class="cod-outro">{$cod_outro}</span><span class="preco">R$ <span class="price-value">{$preco_venda}</span></span></div>
        <img class="barcode-img" src="{$imagem_codigo_barras}" onerror="this.style.display='none';" alt="">
        <div class="codigo-barra">{$cod_barra}</div>
    </div>

</body>
</html>
<!--[/main]-->
